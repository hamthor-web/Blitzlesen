name: Einmalig neue Blitzspiele-Icons erzeugen
on:
  push:
    paths:
      - '.github/workflows/blitzspiele-icon-fix.yml'
permissions:
  contents: write
jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pillow installieren
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Beide 512er-Icons aus dem neuen Blitzspiele-Icon erstellen
        run: |
          python - <<'PY'
          from PIL import Image
          source = Image.open('icons/icon-192.png').convert('RGBA')
          source.resize((512, 512), Image.Resampling.LANCZOS).save('icons/icon-512.png', optimize=True)
          bg = Image.new('RGBA', (512, 512), '#087fef')
          foreground = source.resize((414, 414), Image.Resampling.LANCZOS)
          bg.alpha_composite(foreground, (49, 49))
          bg.save('icons/icon-maskable-512.png', optimize=True)
          PY
      - name: Icon-Dateien einchecken
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-512.png icons/icon-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Blitzspiele-Icon in allen Größen aktualisieren"
            git push
          fi
