function observeWord(completed){if(wordShownAt===null||wordInterrupted||document.visibilityState==='hidden'||index>=order.length)return;const word=order[index],elapsed=performance.now()-wordShownAt,scope=timingScope(),limit=timingLimit(word);if(!Number.isFinite(elapsed)||elapsed<250||(!completed&&elapsed<limit))return;const key='w:'+word;const previous=scope.words[key];const evidence=previous&&typeof previous==='object'?previous:{slow:0,quick:0};if(elapsed>=limit){evidence.slow=(Number(evidence.slow)||0)+1;evidence.quick=0;const list=difficultList();if(!list.includes(word))list.push(word);profile.difficultByLevel[level]=list;}else if(completed){evidence.quick=(Number(evidence.quick)||0)+1;if(evidence.quick>=2){profile.difficultByLevel[level]=difficultList().filter(w=>w!==word);evidence.slow=0;}}if(completed&&elapsed<=25000){scope.samples.push(elapsed/wordUnits(word));scope.samples=scope.samples.filter(x=>Number.isFinite(x)&&x>=80&&x<=5000).slice(-30);}scope.words[key]=evidence;saveProfile();}

sprite.onload=()=>{const c=document.createElement('canvas');c.width=sprite.naturalWidth;c.height=sprite.naturalHeight;const x=c.getContext('2d');x.drawImage(sprite,0,0);const full=x.getImageData(0,0,c.width,c.height);let minX=c.width,minY=c.height,maxX=0,maxY=0;for(let y=0;y<c.height;y++)for(let xx=0;xx<c.width;xx++){if(full.data[(y*c.width+xx)*4+3]>200){minX=Math.min(minX,xx);maxX=Math.max(maxX,xx);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}spriteW=maxX-minX+1;spriteH=maxY-minY+1;spritePixels=x.getImageData(minX,minY,spriteW,spriteH);paintRocket(Number($('words').value),Number($('repeats').value))};
sprite.onerror=()=>{$('error').textContent='Die Raketenfigur konnte nicht geladen werden. Bitte die Seite neu laden.'};
function paintRocket(total,repeated){if(!spritePixels)return;const image=new ImageData(new Uint8ClampedArray(spritePixels.data),spriteW,spriteH),a=image.data,green=[];for(let y=spriteH-1;y>=0;y--)for(let x=0;x<spriteW;x++){const i=(y*spriteW+x)*4;if(a[i+3]>200&&a[i+1]>a[i]*1.12&&a[i+1]>a[i+2]*1.15&&a[i+1]>40)green.push(i)}const yellowPixels=Math.round(green.length*(total?repeated/total:0));for(let k=0;k<yellowPixels;k++){const i=green[k],g=a[i+1];a[i]=Math.min(255,g*1.18+10);a[i+1]=Math.min(255,g*.98+3);a[i+2]=Math.min(a[i+2],g*.28)}const buffer=document.createElement('canvas');buffer.width=spriteW;buffer.height=spriteH;buffer.getContext('2d').putImageData(image,0,0);{const c=$('mascot');c.width=448;c.height=520;const x=c.getContext('2d'),ratio=Math.min(430/spriteW,500/spriteH);x.clearRect(0,0,448,520);x.drawImage(buffer,(448-spriteW*ratio)/2,(520-spriteH*ratio)/2,spriteW*ratio,spriteH*ratio)}drawBigRocket(buffer);$('mascot').dataset.green=total-repeated;$('mascot').dataset.yellow=repeated;$('mascot').dataset.yellowFraction=total?repeated/total:0}
